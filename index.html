<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Study Task Tracker</title>

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main>
        <h1>Study Task Tracker</h1>

        <p>Add a task, then mark it complete when you finish.</p>

        <form id="task-form">

            <label for="task-description">Task</label>
            <input
                id="task-description"
                name="task"
                type="text"
            >

            <label for="task-minutes">Estimated minutes</label>
            <input
                id="task-minutes"
                name="minutes"
                type="number"
                min="1"
            >

            <button type="submit">Add task</button>

            <p id="form-message" aria-live="polite"></p>

        </form>

        <p id="task-count" aria-live="polite">
            Completed: 0
        </p>

        <p id="empty-message">
            No tasks yet. Add your first task above.
        </p>

        <ul id="task-list"></ul>

    </main>

</body>

</html>
